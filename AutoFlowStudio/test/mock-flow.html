<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Mock — Google Flow project</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0b0b0d; color: #eee; margin: 0; padding: 40px; }
      .flow-prompt { width: 60%; min-height: 60px; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #17181c; color: #fff; font-size: 15px; }
      .flow-generate { margin-top: 12px; padding: 10px 22px; border-radius: 999px; border: none; background: #4f7cff; color: #fff; font-weight: 700; cursor: pointer; }
      #results { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
      #results video, #results img { width: 220px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h1>Mock Google Flow — Project</h1>
    <p>Página de prueba que imita los elementos que automatiza la extensión.</p>
    <textarea class="flow-prompt" placeholder="Escribe tu prompt para generar un video"></textarea>
    <div>
      <button class="flow-generate" aria-label="Generate video">Generar</button>
    </div>
    <div id="results"></div>

    <script>
      // Simula el comportamiento de Flow: al generar, tras 600ms aparece un
      // <video> con un data-URL (mp4 minimo). Asi el adaptador detecta el
      // resultado nuevo y extrae la URL para "descargar".
      const TINY_MP4 =
        "data:video/mp4;base64,AAAAHGZ0eXBpc29tAAACAGlzb21pc28ybXA0MQAAAAhmcmVl";
      document.querySelector(".flow-generate").addEventListener("click", () => {
        setTimeout(() => {
          const v = document.createElement("video");
          v.src = TINY_MP4;
          v.setAttribute("data-generated", "1");
          document.getElementById("results").appendChild(v);
        }, 600);
      });
    </script>
  </body>
</html>
