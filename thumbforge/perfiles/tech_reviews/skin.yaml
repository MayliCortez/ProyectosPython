nombre: "Banco de Pruebas - identidad visual"

lienzo:
  ancho: 1280
  alto: 720

paleta:
  fondo: "#0d1117"
  texto: "#ffffff"
  acento: "#31d158"
  sombra: "#000000"

tipografia:
  titular:
    archivo: "fonts/DejaVuSans-Bold.ttf"
    tamano_max: 140
    tamano_min: 62
    interletrado: -3
    mayusculas: true
  secundario:
    archivo: "fonts/DejaVuSansMono-Bold.ttf"
    tamano_max: 52
    tamano_min: 30
    interletrado: 0
    mayusculas: false

texto:
  posicion: "izq_sup"
  ancho_max_pct: 52
  interlineado: 0.98
  color: "#ffffff"
  contorno:
    grosor: 3
    color: "#0d1117"
  sombra:
    desplazamiento: [0, 6]
    desenfoque: 14
    opacidad: 0.45

placa:
  activa: false

gradiente:
  activo: true
  color: "#0d1117"
  opacidad: 0.60
  direccion: "izquierda"
  alto_pct: 100

barra_acento:
  activa: true
  color: "#31d158"
  grosor_px: 10
  posicion: "sobre_texto"

logo:
  archivo: "assets/logo.png"
  posicion: "der_inf"
  ancho_pct: 10
  opacidad: 0.9
  margen_pct: 4

zonas_seguras:
  inferior_pct: 8
  inferior_derecha_pct: 18

# Saturado y duro: el feed de tecnologia se gana por contraste, no por
# sutileza. El delta E entre variantes es alto a proposito, para que las
# tres miniaturas no sean la misma con otro texto.
colorimetria:
  contraste_minimo: 7.0
  contraste_objetivo: 14.0
  armonia_preferida: "split_complementario"
  armonia_ajuste_minimo: 0.45
  calidez_objetivo: -0.10
  calidez_tolerancia: 0.55
  saturacion_maxima: 0.90
  saturacion_minima: 0.30
  luminancia_objetivo: 0.30
  luminancia_tolerancia: 0.25
  delta_e_minimo_entre_variantes: 16.0
  colores_texto: ["#ffffff", "#31d158", "#0d1117"]
  colores_refuerzo: ["#0d1117", "#000000"]
  refuerzo_preferido: "contorno"
  max_colores_paleta: 6
  peso_minimo_paleta: 0.02

# Texto arriba a la izquierda y sujeto abajo a la derecha, arriba del badge.
composicion:
  punto_focal_preferido: "inferior_derecho"
  espacio_negativo_minimo: 0.25
  detalle_maximo_bajo_texto: 0.30
  margen_pct: 3
  desbalance_maximo: 0.55
  separacion_sujeto_minima: 0.45
  retencion_desenfoque_minima: 0.45
  legibilidad_feed_minima: 0.60
  alto_texto_feed_minimo: 12
  alinear_a_tercios: true
  # Aca el contraste pesa mas que la limpieza de la zona: la marca aguanta
  # texto sobre textura, no aguanta texto que no se lee.
  pesos:
    limpieza: 0.24
    contraste: 0.32
    preferencia: 0.20
    foco_libre: 0.12
    tercios: 0.06
    equilibrio: 0.06
